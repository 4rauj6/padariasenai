<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../cadastro receitas/cadReceitas.css" />
  </head>
  <body>
    <div class="hero">
      <div class="hero-header">
        <div class="header">
          <div class="header-text">
            <i class="fa-regular fa-file"></i>
            <div class="header-text-content">
              <h1>CADASTRAR NOVA RECEITA</h1>
              <span>PREENCHA AS INFORMAÇÕES DA NOVA RECEITA</span>
            </div>
          </div>

          <div class="exit-button">
            <button>
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
      </div>
      <div class="form-content">
        <section class="form-section">
          <div class="form-receita">
            <!--NÃO MEXER NO ACTION DO FORMULARIO-->
            <form action="#">
              <h3>INFORMAÇÕES BÁSICAS</h3>

              <div class="form-receita-inputs">
                <label for="receitaNome">NOME DA RECEITA</label>
                <input
                  type="text"
                  name="receitaNome"
                  id="receitaNome"
                  placeholder="Pão Françês"
                  required
                />

                <label for="categoriaReceita">CATEGORIA</label>
                <select name="categoriaReceita" id="categoriaReceita" required>
                  <option value="">Seleciona uma categoria</option>
                  <option value="massaSalgada">Massa salgada</option>
                  <option value="massaDoce">Massa doce</option>
                  <option value="sobremessa">Sobremessa</option>
                </select>

                <label for="descReceita">DESCRIÇÃO</label>
                <textarea
                  name="descReceita"
                  id="descReceita"
                  placeholder="Descreva a sua receita"
                  required
                ></textarea>

                <label for="imgReceita">FOTO DA RECEITA:</label>
                <input type="file" id="imgReceita" name="imgReceita" accept="image/*" class="imgSelector">
              </div>
            </form>
          </div>
        </section>

        <div class="table-content">
          <section class="table-box">
            <div class="table-container">
              <h3>INGREDIENTES</h3>
              <br />

              <div>
                <table>
                  <tr>
                    <th>INGREDIENTE</th>
                    <th>QUANTIDADE</th>
                    <th>UNIDADE</th>
                    <th>CUSTO UNI.</th>
                    <th>CUSTO TOTAL</th>
                  </tr>
                  <tr>
                    <td>
                      <input type="text" placeholder="Digite o ingrediente" />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="0,000"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="Defina a unidade"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="R$0,00"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="R$0,00"
                        inputmode="numeric"
                      />
                      <button class="td-button">
                        <i class="fa-regular fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>

                  <tr>
                    <td>
                      <input type="text" placeholder="Digite o ingrediente" />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="0,000"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="Defina a unidade"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="R$0,00"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="R$0,00"
                        inputmode="numeric"
                      />
                      <button class="td-button">
                        <i class="fa-regular fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>

                  <tr>
                    <td>
                      <input type="text" placeholder="Digite o ingrediente" />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="0,000"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="Defina a unidade"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="R$0,00"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="R$0,00"
                        inputmode="numeric"
                      />
                      <button class="td-button">
                        <i class="fa-regular fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>

                  <tr>
                    <td>
                      <input type="text" placeholder="Digite o ingrediente" />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="0,000"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="Defina a unidade"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="R$0,00"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="R$0,00"
                        inputmode="numeric"
                      />
                      <button class="td-button">
                        <i class="fa-regular fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>

                  <tr>
                    <td>
                      <input type="text" placeholder="Digite o ingrediente" />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="0,000"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="Defina a unidade"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="R$0,00"
                        inputmode="numeric"
                      />
                    </td>
                    <td>
                      <input
                        type="number"
                        placeholder="R$0,00"
                        inputmode="numeric"
                      />
                      <button class="td-button">
                        <i class="fa-regular fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>
                </table>

                <button class="addIngred">
                  <i class="fa-solid fa-plus"></i>
                  ADICIONAR INGREDIENTE
                </button>
              </div>
            </div>
          </section>

          <div class="table-container-2">
            <section>
              <div class="infoReceitas">
                <h3>INFORMAÇÕES DA RECEITA</h3>

                <div class="maisInfoReceitas">
                  <div class="infoBox">
                    <span>
                      <i class="fa-solid fa-chart-simple"></i> RENDIMENTO</span
                    >
                  </div>

                  <div class="infoBox">
                    <span
                      ><i class="fa-solid fa-scale-balanced"></i> PESO POR
                      UNIDADE</span
                    >
                  </div>

                  <div class="infoBox">
                    <span
                      ><i class="fa-regular fa-clock"></i> TEMPO DE
                      PREPARO</span
                    >
                  </div>
                </div>
                <hr />
                <div class="mp-container">
                  <h4>MODO DE PREPARO</h4>
                  <textarea
                    name="modoPreparo"
                    id="modoPreparo"
                    placeholder="Descreva o modo de preparo da receita"
                    required
                  ></textarea>
                </div>
              </div>
            </section>
          </div>
        </div>

        <section class="modal hidden">
          <!--MODAL PARA ADICIONAR OS INGREDIENTES-->
          <div class="overlay hidden">
            <div class="modal-body">
              <div class="modal-text">
                <button class="close-modal">
                  <i class="fa-solid fa-xmark"></i>
                </button>
                <h3>Adicionando ingredientes</h3>
                <div class="addingIngred">
                  <label for="nomeIngred">Selecione do ingrediente:</label>
                  <select name="nomeIngred" id="nomeIngred">
                    <!--<option value="farinha">Farinha</option>-->
                    <option value="acucar">Açúcar</option>
                    <option value="fermento">Fermento</option>
                    <option value="sal">Sal</option>
                    <option value="ovos">Ovos</option>
                  </select>

                  <label for="quantIngred">Selecione a quantidade (%):</label>
                  <select name="quantIngred" id="quantIngred">
                    <option value="0">Selecione a porcentagem</option>
                    <option value="5">5%</option>
                    <option value="10">10%</option>
                    <option value="15">15%</option>
                    <option value="20">20%</option>
                  </select>

                  <label for="gramaDoIngred">Quantidade em grama:</label>
                  <span id="gramaDoIngred"></span>

                  <label for="tipoIngred"
                    >Selecione o tipo do ingrediente:</label
                  >
                  <select name="tipoIngred" id="tipoIngred">
                    <option value="grao">Grão</option>
                    <option value="massa">Massa</option>
                    <option value="farinha1">Farinha 1</option>
                    <option value="farinha2">Farinha 2</option>
                    <option value="farinha3">Farinha 3</option>
                  </select>

                  <div class="modal-buttons">
                    <button class="add-mais-ingred">
                      <i class="fa-solid fa-plus"></i> Mais
                    </button>

                    <button class="save-ingred">
                      <i class="fa-solid fa-check"></i> Salvar ingrediente
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <hr />
      <section>
        <br />
        <div class="saveButton">
          <button>SALVAR RECEITA</button>
        </div>
      </section>
    </div>
  </body>
</html>
